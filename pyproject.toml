[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soctriage"
version = "0.1.0"
description = "SOC alert triage: OCSF normalization, MITRE ATT&CK mapping, DBSCAN incident clustering, risk scoring and LLM summaries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dawn Creter" }]
dependencies = ["pydantic>=2.5", "numpy>=1.26", "scikit-learn>=1.4", "fastapi>=0.110"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["httpx>=0.27", "uvicorn>=0.30", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
soc-triage = "soctriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=soctriage --cov-branch --cov-fail-under=85"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
